version: "3.8"

services:
  namenode:
    image: hozien/big-data:namenode
    container_name: namenode
    ports:
      - "9000:9000"   # HDFS
      - "9870:9870"   # NameNode Web UI
    environment:
      - CLUSTER_NAME=bigdata
    volumes:
      - namenode_data:/hadoop/dfs/name

  resourcemanager:
    image: hozien/big-data:namenode
    container_name: resourcemanager
    ports:
      - "8088:8088"   # YARN Web UI
    environment:
      - CLUSTER_NAME=bigdata
    depends_on:
      - namenode

  datanode1:
    image: hozien/big-data:datanode
    container_name: datanode1
    ports:
      - "9864:9864"   # DataNode Web UI
      - "9866:9866"   # Data streaming
      - "9867:9867"   # IPC
    environment:
      - NAMENODE_URI=hdfs://namenode:9000
    depends_on:
      - namenode
    volumes:
      - datanode1_data:/hadoop/dfs/data

  datanode2:
    image: hozien/big-data:datanode
    container_name: datanode2
    ports:
      - "9865:9864"   # DataNode Web UI (different host port)
      - "9868:9866"   # Data streaming
      - "9869:9867"   # IPC
    environment:
      - NAMENODE_URI=hdfs://namenode:9000
    depends_on:
      - namenode
    volumes:
      - datanode2_data:/hadoop/dfs/data

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data: